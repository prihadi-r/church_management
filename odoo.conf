# =============================================================================
#  Darash — Church Management (Odoo 18) — Odoo configuration
#
#  This file is mounted into the container at /etc/odoo/odoo.conf by
#  docker-compose.yml (and baked into the image by the Dockerfile).
#
#  NOTE: The database credentials below MUST match the `db` service
#  environment in docker-compose.yml. Change them together.
# =============================================================================

[options]

# Search path for addons. The module lives in /mnt/extra-addons/church_management.
# Odoo automatically appends its own core addons path, so `base`, `website`,
# `crm`, `event` and `account` resolve without extra configuration.
addons_path = /mnt/extra-addons

# Filestore / session data (persisted via the `odoo-web-data` volume).
data_dir = /var/lib/odoo

# PostgreSQL connection — host `db` is the compose service name.
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

# Master (admin) password used to create / manage databases from the web UI.
# Default Odoo value is `admin` — CHANGE THIS IN PRODUCTION.
# admin_passwd = admin

# Leave empty so Odoo can manage any database (incl. creating new ones from
# the web UI). Restrict with a dbfilter for production multi-db setups.
# dbfilter = ^%d$
