name: 🐛 Bug Report
description: Report a problem or unexpected behaviour in the Church Management module.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in the details below.

  - type: input
    id: odoo_version
    attributes:
      label: Odoo Version
      description: Which Odoo version are you using? (e.g. 18.0)
      placeholder: "18.0"
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: Module Version
      description: Which version of church_management are you running? (see __manifest__.py)
      placeholder: "2.0.0"
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: How are you running Odoo?
      options:
        - Docker / Docker Compose
        - Local Odoo installation
        - Linux server
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps to reproduce the issue.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include error messages and stack traces if any.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any relevant logs or add screenshots.
      render: text
    validations:
      required: false
